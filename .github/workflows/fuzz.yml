name: Fuzz

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-etag-algo:
    name: Fuzz ETag algorithm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fuzz for 10 minutes
        id: fuzz
        run: go test -fuzz=FuzzETag_ComputeExpectedETag -fuzztime=10m ./etag/...
      - name: Upload crash corpus
        # Preserve any crashing input the fuzzer wrote. Without this, a
        # Monday crash vanishes Tuesday when the runner is recycled.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: etag/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
